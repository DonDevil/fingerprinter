pipeline:
  # Reject discovered videos shorter than this duration (seconds).
  # Set to -1 to disable short-video rejection and process full video base.
  short_video_threshold_seconds: 19
  # Optional reference title for Phase B quick matching.
  target_title: "Blast"
  # Reference target media used across fingerprint stages.
  target_file_path: target/Blast.mp4
  # Stage-2 policy thresholds for quick target matching score.
  phase_b_low_match_threshold: 0.10
  phase_b_high_match_threshold: 0.40
  # On confirmed match, pending jobs from same source domain get this priority.
  pirate_domain_boost_priority: 1

queue:
  backend: crawler
  crawler_media_db_path: ../crawler/storage/media_evidence.db
  worker_name: fingerprinter-worker
  poll_interval_seconds: 2
  max_retry_count: 3
  # If a worker dies after claiming a job, move stale claimed jobs back to pending after this many seconds.
  reclaim_claimed_after_seconds: 600

downloader:
  download_dir: storage/downloads
  request_timeout_seconds: 30
  # Keep Tor disabled unless SOCKS proxy routing is intentionally configured.
  enable_tor: true
  # Tor SOCKS endpoint used when enable_tor is true.
  tor_proxy_url: socks5h://127.0.0.1:9050

storage_policy:
  # Local metadata DB for processed assets and file lifecycle.
  metadata_db_path: storage/processing.db
  # Maximum number of rejected/test files to retain.
  max_rejected_files: 200
  # Maximum total size of rejected/test files (MB) to retain.
  max_rejected_bytes_mb: 2048
  # When limits are exceeded, delete oldest rejected files first.
  delete_rejected_overflow: true

video_fingerprint:
  # Target/movie fingerprint segments (seconds). Keep small for fine-grained matching.
  target_segment_seconds: 1.0
  # Candidate/downloaded video segment duration (seconds).
  candidate_segment_seconds: 1.0
  # Candidate segment duration used for high-intensity mode.
  candidate_segment_seconds_high_intensity: 1.0
  # Number of sampled frames per second for segment fingerprinting.
  frame_sample_fps: 2.0
  # Enable NVIDIA CUDA hardware decode for video fingerprint extraction when available.
  use_gpu: true
  # CUDA device index (0 for first GPU).
  gpu_device: 0

sequence_alignment:
  # Sequence alignment method: constrained or dtw.
  method: constrained
  # Sakoe-Chiba style band ratio used by constrained DTW (0.0-1.0).
  band_ratio: 0.15

audio_fingerprint:
  # Segment duration for audio fingerprints (seconds).
  segment_seconds: 1.5
  # Audio alignment method: offset_xcorr or dtw.
  alignment_method: offset_xcorr
  # Band ratio used for DTW-based audio alignment.
  alignment_band_ratio: 0.2

dinov2:
  # Pretrained model used for frame embeddings.
  model_name: facebook/dinov2-base
  # auto, cpu, or cuda.
  device: auto
  # FPS used when building/storing target embeddings.
  target_sample_fps: 2.0
  # FPS used when embedding crawler clips.
  candidate_sample_fps: 2.0
  # Per-frame cosine similarity threshold for accepting nearest neighbors.
  cosine_threshold: 0.93
  # Secondary distance check score: 1/(1+l2_distance).
  l2_score_threshold: 0.70
  # Require the best match to exceed the second-best by this margin.
  margin_threshold: 0.03
  # Minimum consecutive accepted frames required to consider a match.
  min_consecutive_frames: 6
  # Maximum allowed jump in matched target frame index between consecutive clip frames.
  max_target_frame_step: 3
  # Minimum average cosine required inside the best consecutive run.
  min_run_avg_cosine: 0.94
